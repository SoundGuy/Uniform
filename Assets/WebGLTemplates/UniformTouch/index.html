<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | {{{ PRODUCT_NAME }}}</title>
    <style>
      body {
        font-family: Helvetica, Verdana, Arial, sans-serif;
        background-color: #dbd9d3;
        color: black;
        text-align: center;
        padding: 0;
        border: 0;
        margin: 0;
      }
      #unity-root {
        display: block;
        text-align: center;
        padding-top: 8px;
      }
      #unity-stage {
        position: relative;
        display: inline-block;
        margin: 0 auto;
      }
      #unity-canvas {
        display: block;
        background: #1F1F20;
      }
      #mobile-controls {
        display: none;
        margin-top: 8px;
      }
      #rotate-button {
        appearance: none;
        border: 1px solid #555;
        border-radius: 4px;
        background: #eee;
        color: #111;
        font-size: 12px;
        line-height: 1;
        padding: 7px 10px;
        cursor: pointer;
      }
      a:link, a:visited {
        color: #000;
      }
      a:active, a:hover {
        color: #666;
      }
      .game-footer {
        font-size: x-small;
        padding-bottom: 12px;
      }
      body.mobile #unity-root {
        padding-top: 8px;
      }
      body.mobile #mobile-controls {
        display: block;
      }
    </style>
#if SHOW_DIAGNOSTICS
    <link rel="stylesheet" href="<<<TemplateData/diagnostics.css>>>">
    <script src="<<<TemplateData/diagnostics.js>>>"></script>
#endif
  </head>
  <body>
    <div id="unity-root">
      <div id="unity-stage">
        <canvas id="unity-canvas" width={{{ WIDTH }}} height={{{ HEIGHT }}} tabindex="-1" style="width: {{{ WIDTH }}}px; height: {{{ HEIGHT }}}px;"></canvas>
      </div>
    </div>
    <div id="mobile-controls">
      <button id="rotate-button" type="button" aria-label="Toggle rotated view">Rotate</button>
    </div>
#if SHOW_DIAGNOSTICS
    <div id="unity-footer">
        <img id="diagnostics-icon" src="TemplateData/webmemd-icon.png">
    </div>
#endif
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const stage = document.querySelector("#unity-stage");
      const rotateButton = document.getElementById("rotate-button");
      const mobileControls = document.getElementById("mobile-controls");
      const baseWidth = {{{ WIDTH }}};
      const baseHeight = {{{ HEIGHT }}};
      const aspectRatio = baseWidth / baseHeight;
      const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      let rotatedFallback = false;
      let nativeLandscapeLocked = false;

      if (isMobile) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.body.classList.add("mobile");
        mobileControls.style.display = "block";
      }

      function setPortraitLayout() {
        rotatedFallback = false;
        stage.style.transform = "";
        stage.style.transformOrigin = "";
        stage.style.margin = "0 auto";
        rotateButton.textContent = "Rotate";
      }

      function setRotatedFallbackLayout() {
        rotatedFallback = true;
        stage.style.transform = "rotate(90deg)";
        stage.style.transformOrigin = "center center";
        stage.style.margin = "0";
        rotateButton.textContent = "Portrait";
      }

      function layoutCanvas() {
        if (!isMobile) {
          canvas.style.width = baseWidth + "px";
          canvas.style.height = baseHeight + "px";
          return;
        }

        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        let targetWidth;
        let targetHeight;

        if (!rotatedFallback) {
          targetWidth = viewportWidth;
          targetHeight = targetWidth / aspectRatio;
          if (targetHeight > viewportHeight) {
            targetHeight = viewportHeight;
            targetWidth = targetHeight * aspectRatio;
          }

          stage.style.width = targetWidth + "px";
          stage.style.height = targetHeight + "px";
          canvas.style.width = targetWidth + "px";
          canvas.style.height = targetHeight + "px";
          return;
        }

        targetWidth = viewportHeight;
        targetHeight = targetWidth / aspectRatio;
        if (targetHeight > viewportWidth) {
          targetHeight = viewportWidth;
          targetWidth = targetHeight * aspectRatio;
        }

        stage.style.width = targetWidth + "px";
        stage.style.height = targetHeight + "px";
        canvas.style.width = targetWidth + "px";
        canvas.style.height = targetHeight + "px";

        // Rotated element uses unrotated box space; offset to keep centered.
        const offsetX = (targetHeight - targetWidth) / 2;
        const offsetY = (targetWidth - targetHeight) / 2;
        stage.style.transform = "translate(" + offsetX + "px, " + offsetY + "px) rotate(90deg)";
      }

      async function tryNativeLandscapeLock() {
        if (!document.fullscreenElement && canvas.requestFullscreen) {
          try {
            await canvas.requestFullscreen();
          } catch (err) {
            return false;
          }
        }

        if (screen.orientation && screen.orientation.lock) {
          try {
            await screen.orientation.lock("landscape");
            return true;
          } catch (err) {
            return false;
          }
        }

        return false;
      }

      async function rotateToggle() {
        if (!isMobile) {
          return;
        }

        if (nativeLandscapeLocked) {
          nativeLandscapeLocked = false;
          rotateButton.textContent = "Rotate";
          if (screen.orientation && screen.orientation.unlock) {
            try {
              screen.orientation.unlock();
            } catch (err) {
              // Ignore unlock failures on unsupported browsers.
            }
          }
        } else if (!rotatedFallback) {
          const locked = await tryNativeLandscapeLock();
          if (!locked) {
            setRotatedFallbackLayout();
          } else {
            nativeLandscapeLocked = true;
            rotateButton.textContent = "Portrait";
          }
        } else {
          setPortraitLayout();
          if (screen.orientation && screen.orientation.unlock) {
            try {
              screen.orientation.unlock();
            } catch (err) {
              // Ignore unlock failures on unsupported browsers.
            }
          }
        }

        layoutCanvas();
      }

      rotateButton.addEventListener("click", rotateToggle);
      window.addEventListener("resize", layoutCanvas);
      window.addEventListener("orientationchange", layoutCanvas);
      layoutCanvas();

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
#if SHOW_DIAGNOSTICS
        document.getElementById("diagnostics-icon").onclick = () => {
            unityDiagnostics.openDiagnosticsDiv(unityInstance.GetMetricsInfo);
        };
#endif
        layoutCanvas();
      }).catch((message) => {
        alert(message);
      });
    </script>

    <div class="game-footer">
      <br>
      Developed during <a href="http://globalgamejam.org/2014/games/uniform">Global Game Jam 2014</a>
      <br>
      Download for: <a href="UniformPC.zip">PC</a>, <a href="UniformMacOSX.zip">Mac</a>, <a href="UniformLinux.zip">Linux</a><br>
      <a href="index_old.html">Run without WebGL</a><br>
      <br>
      <br><a href="http://adventuremob.com/unparented/uniform-did-you-play/">Read More about the game after playing</a><br>
    </div>
  </body>
</html>
